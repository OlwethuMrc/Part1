<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Blade Babershop | Enquire</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <header>
        <nav class="navbar">

            <div class="logo">
                THE BLADE
                <span>BABERSHOP</span>
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="enquire.html">Enquire</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

        </nav>
    </header>


    <!-- Enquiry -->
    <main>

        <section class="page-header">

            <p class="section-title">
                MAKE AN ENQUIRY
            </p>

            <h1>
                Book Your Appointment
            </h1>

        </section>


        <section class="enquire">

            <form id="enquiryForm">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >


                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    required
                >


                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    required
                >


                <label for="service">
                    Select Service
                </label>

                <select id="service" name="service" required>

                    <option value="">
                        Select a service
                    </option>

                    <option value="Classic Haircut">
                        Classic Haircut - R150
                    </option>

                    <option value="Fade">
                        Fade & Style - R180
                    </option>

                    <option value="Beard">
                        Beard Trim - R100
                    </option>

                    <option value="Full Grooming">
                        Full Grooming - R250
                    </option>

                </select>


                <label for="date">
                    Preferred Date
                </label>

                <input
                    type="date"
                    id="date"
                    name="date"
                    required
                >


                <label for="message">
                    Message
                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="5"
                    placeholder="Enter your message..."
                ></textarea>


                <button
                    type="submit"
                    class="button">
                    Send Enquiry
                </button>


                <p id="formMessage"></p>

            </form>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>
             2026 The Blade Babershop.
            
        </p>

    </footer>


    <script src="js/script.js"></script>

</body>
</html>
